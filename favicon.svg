<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Six — agent runtime mark">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7BFFE9"/>
      <stop offset="45%" stop-color="#34E5C4"/>
      <stop offset="100%" stop-color="#34E5C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAFFFA"/>
      <stop offset="35%" stop-color="#34E5C4"/>
      <stop offset="100%" stop-color="#1E8C7C"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- void tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0A0C10"/>

  <!-- plasma core glow inside the hex -->
  <circle cx="32" cy="30" r="18" fill="url(#core)" opacity="0.55"/>

  <!-- flat-top hexagon = the Six mark -->
  <g filter="url(#glow)">
    <polygon points="56,32 44,52.78 20,52.78 8,32 20,11.22 44,11.22"
             fill="none" stroke="url(#rim)" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <!-- three indigo data-edges toward center (architecture echo) -->
  <g stroke="#7C8CF8" stroke-width="1.4" opacity="0.85" stroke-linecap="round">
    <line x1="32" y1="30" x2="20" y2="18"/>
    <line x1="32" y1="30" x2="46" y2="20"/>
    <line x1="32" y1="30" x2="22" y2="44"/>
  </g>

  <!-- six luminous tool-nodes + bright center node -->
  <g fill="#34E5C4">
    <circle cx="20" cy="18" r="2.2"/>
    <circle cx="46" cy="20" r="2.2"/>
    <circle cx="22" cy="44" r="2.2"/>
    <circle cx="44" cy="42" r="2.2"/>
    <circle cx="15" cy="32" r="2.2"/>
    <circle cx="49" cy="34" r="2.2"/>
  </g>
  <circle cx="32" cy="30" r="3.6" fill="#EAFFFA"/>

  <!-- top-left specular gleam on the rim -->
  <path d="M20,11.22 L44,11.22" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
</svg>
